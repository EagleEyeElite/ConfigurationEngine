apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-engine
  labels:
    app: configuration-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configuration-engine
  template:
    metadata:
      labels:
        app: configuration-engine
    spec:
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "untrusted"
          effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/hostname: k3s-apps-vm
      # The image (nginx-unprivileged) runs as uid 101 on port 8080; the
      # default namespace enforces the `restricted` Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.k8s.gated.conrad-klaus.de/configuration-engine:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: configuration-engine
spec:
  type: ClusterIP
  selector:
    app: configuration-engine
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: configuration-engine
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    # Opt into the public Traefik entrypoints. The k3s cluster (managed
    # by personal-infrastructure) is deny-by-default for public exposure:
    # an Ingress without this annotation attaches only to websecure-ts
    # and becomes Tailscale-only. `web` picks up port-80 requests for
    # the entrypoint-level 308 redirect to HTTPS.
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    # cloudflare-only WAF allowlist. Required since 2026-06-26: it moved off
    # the Traefik websecure entrypoint default to a per-public-router
    # middleware (so the unlisted hanna.hidden host could opt out — Traefik
    # can't exempt one router from an entrypoint middleware). Without this,
    # this public app is reachable directly on the WAN IP, bypassing the
    # Cloudflare WAF. Middleware lives in kube-system (personal-infrastructure).
    # Apply this manifest BEFORE `pulumi up` removes the entrypoint default.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-cloudflare-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - configurator.conrad-klaus.de
      secretName: configurator-tls
  rules:
    - host: configurator.conrad-klaus.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: configuration-engine
                port:
                  number: 80
