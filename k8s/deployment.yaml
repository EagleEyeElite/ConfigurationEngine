# Deployed into its own namespace, `configurator`, which personal-infrastructure
# owns (src/self-hosted/app-namespaces.ts): default-deny network policies,
# the restricted Pod Security Standard, the access middlewares, and the way
# in from Traefik. This file owns what runs inside it.
#
#   kubectl apply -f k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-engine
  namespace: configurator
  labels:
    app: configuration-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configuration-engine
  template:
    metadata:
      labels:
        app: configuration-engine
    spec:
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "untrusted"
          effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/hostname: k3s-apps-vm
      # The image (nginx-unprivileged) runs as uid 101 on port 8080; the
      # namespace enforces the `restricted` Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.k8s.gated.conrad-klaus.de/configuration-engine:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: configuration-engine
  namespace: configurator
spec:
  type: ClusterIP
  selector:
    app: configuration-engine
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public through Cloudflare. The host's listener on the `public` Gateway, and
# its certificate, come from personal-infrastructure (public.ts lists the
# host for this namespace); the cluster refuses this route without the
# cloudflare-only filter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: configuration-engine
  namespace: configurator
spec:
  parentRefs:
    - name: public
      namespace: kube-system
  hostnames:
    - configurator.conrad-klaus.de
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: cloudflare-only
      backendRefs:
        - name: configuration-engine
          port: 80
